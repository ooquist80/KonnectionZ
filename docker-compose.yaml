services:
  db:
    image: mariadb:12.2.2
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
#  web:
#    image: kz-frontend:latest
#    ports:
#      - "80:80"
#    depends_on:
#      - api
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      ALLOWED_ORIGINS: http://localhost
    ports:
      - "8080:8000"
    depends_on:
      - db
volumes:
  db_data: