info:
  name: Play Words
  type: http
  seq: 2
  tags:
    - play

http:
  method: PUT
  url: "{{baseUrl}}/play/:game_id"
  params:
    - name: game_id
      value: "4"
      type: path
  body:
    type: json
    data: |-
      [
           "12",
            "31",
            "11",
            "2"
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 202 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/play/:game_id"
      method: PUT
      params:
        - name: game_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          [
            {}
          ]
    response:
      status: 202
      statusText: Accepted
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "game_id": 0,
            "game_status": {
              "start_time": "",
              "end_time": "",
              "words_remaining": [],
              "wordsets_completed": [
                {
                  "id": 0,
                  "category": "",
                  "difficulty": 0,
                  "words": [
                    {
                      "id": 0,
                      "word": ""
                    }
                  ]
                }
              ],
              "turn_count": 0
            },
            "result_message": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/play/:game_id"
      method: PUT
      params:
        - name: game_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          [
            {}
          ]
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
