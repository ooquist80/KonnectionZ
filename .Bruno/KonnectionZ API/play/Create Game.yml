info:
  name: Create Game
  type: http
  seq: 1
  tags:
    - play

http:
  method: POST
  url: "{{baseUrl}}/play/:gameset_id"
  params:
    - name: gameset_id
      value: ""
      type: path
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: auth/token
    refreshTokenUrl: "{{oauth_refresh_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: header
    scope: user:play user:admin
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/play/:gameset_id"
      method: POST
      params:
        - name: gameset_id
          value: ""
          type: path
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "game_id": 0,
            "game_status": {
              "start_time": "",
              "end_time": "",
              "words_remaining": [],
              "wordsets_completed": [
                {
                  "id": 0,
                  "category": "",
                  "difficulty": 0,
                  "words": [
                    {
                      "id": 0,
                      "word": ""
                    }
                  ]
                }
              ],
              "turn_count": 0
            },
            "result_message": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/play/:gameset_id"
      method: POST
      params:
        - name: gameset_id
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
