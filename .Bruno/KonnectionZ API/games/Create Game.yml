info:
  name: Create Game
  type: http
  seq: 2
  tags:
    - games

http:
  method: POST
  url: "{{baseUrl}}/games/"
  body:
    type: json
    data: |-
      {
        "gameset_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/games/"
      method: POST
      body:
        type: json
        data: |-
          {
            "user_id": 0,
            "gameset_id": 0,
            "start_time": "",
            "end_time": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "user_id": 0,
            "gameset_id": 0,
            "start_time": "",
            "end_time": "",
            "completed_wordsets": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/games/"
      method: POST
      body:
        type: json
        data: |-
          {
            "user_id": 0,
            "gameset_id": 0,
            "start_time": "",
            "end_time": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
