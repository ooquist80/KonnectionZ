info:
  name: Get Game
  type: http
  seq: 1
  tags:
    - games

http:
  method: GET
  url: "{{baseUrl}}/games/:game_id"
  params:
    - name: game_id
      value: "3"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/games/:game_id"
      method: GET
      params:
        - name: game_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "user_id": 0,
            "gameset": {
              "id": "",
              "date": "",
              "name": "",
              "wordsets": [
                {
                  "id": 0,
                  "category": "",
                  "difficulty": 0,
                  "words": [
                    {
                      "id": 0,
                      "word": ""
                    }
                  ]
                }
              ]
            },
            "start_time": "",
            "end_time": "",
            "completed_wordsets": []
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/games/:game_id"
      method: GET
      params:
        - name: game_id
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
