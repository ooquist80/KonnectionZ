info:
  name: Play game
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/games/play/:game_id"
  params:
    - name: game_id
      value: "6"
      type: path
  body:
    type: json
    data: |2-
       [
         "fiskare",
         "skola",
         "bordsben",
         "landskap"
       ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
