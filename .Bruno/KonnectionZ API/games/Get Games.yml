info:
  name: Get Games
  type: http
  seq: 1
  tags:
    - games

http:
  method: GET
  url: "{{baseUrl}}/games/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/games/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "user_id": 0,
              "gameset_id": 0,
              "start_time": "",
              "end_time": "",
              "completed_wordsets": ""
            }
          ]
