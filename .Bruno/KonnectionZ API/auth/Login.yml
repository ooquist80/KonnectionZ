info:
  name: Login
  type: http
  seq: 1
  tags:
    - users

http:
  method: POST
  url: "{{baseUrl}}/auth/token"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: ""
        disabled: true
      - name: username
        value: olle
      - name: password
        value: pass
      - name: scope
        value: user:play user:admin
      - name: client_id
        value: ""
        disabled: true
      - name: client_secret
        value: ""
        disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let token = res.getBody().access_token
        bru.setEnvVar("token", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/users/token"
      method: POST
      body:
        type: form-urlencoded
        data:
          - name: grant_type
            value: ""
          - name: username
            value: ""
          - name: password
            value: ""
          - name: scope
            value: ""
          - name: client_id
            value: ""
          - name: client_secret
            value: ""
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/users/token"
      method: POST
      body:
        type: form-urlencoded
        data:
          - name: grant_type
            value: ""
          - name: username
            value: ""
          - name: password
            value: ""
          - name: scope
            value: ""
          - name: client_id
            value: ""
          - name: client_secret
            value: ""
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
