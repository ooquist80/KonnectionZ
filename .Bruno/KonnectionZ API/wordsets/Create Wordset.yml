info:
  name: Create Wordset
  type: http
  seq: 2
  tags:
    - wordsets

http:
  method: POST
  url: "{{baseUrl}}/wordsets"
  body:
    type: json
    data: |-
      {
        "category": "",
        "difficulty": 0,
        "words": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/wordsets"
      method: POST
      body:
        type: json
        data: |-
          {
            "category": "",
            "difficulty": 0,
            "words": []
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "category": "",
            "difficulty": 0,
            "words": [
              {
                "id": 0,
                "word": ""
              }
            ]
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/wordsets"
      method: POST
      body:
        type: json
        data: |-
          {
            "category": "",
            "difficulty": 0,
            "words": []
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
