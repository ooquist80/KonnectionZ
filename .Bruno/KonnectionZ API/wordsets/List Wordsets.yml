info:
  name: List Wordsets
  type: http
  seq: 1
  tags:
    - wordsets

http:
  method: GET
  url: "{{baseUrl}}/wordsets"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/wordsets"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "category": "",
              "difficulty": 0,
              "words": []
            }
          ]
