info:
  name: List Wordsets
  type: http
  seq: 1
  tags:
    - wordsets

http:
  method: GET
  url: "{{baseUrl}}/wordsets"
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: auth/token
    refreshTokenUrl: "{{oauth_refresh_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: header
    scope: user:play user:admin
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/wordsets"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 0,
              "category": "",
              "difficulty": 0,
              "words": [
                {
                  "id": 0,
                  "word": ""
                }
              ]
            }
          ]
