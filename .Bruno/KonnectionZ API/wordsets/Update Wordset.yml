info:
  name: Update Wordset
  type: http
  seq: 4
  tags:
    - wordsets

http:
  method: PUT
  url: "{{baseUrl}}/wordsets/:wordset_id"
  params:
    - name: wordset_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "category": "",
        "difficulty": 0,
        "words": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/wordsets/:wordset_id"
      method: PUT
      params:
        - name: wordset_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "category": "",
            "difficulty": 0,
            "words": []
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "category": "",
            "difficulty": 0,
            "words": []
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/wordsets/:wordset_id"
      method: PUT
      params:
        - name: wordset_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "category": "",
            "difficulty": 0,
            "words": []
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
