info:
  name: Get Gameset
  type: http
  seq: 2
  tags:
    - gamesets

http:
  method: GET
  url: "{{baseUrl}}/gamesets/:gameset_id"
  params:
    - name: gameset_id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/gamesets/:gameset_id"
      method: GET
      params:
        - name: gameset_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "date": "",
            "name": "",
            "wordsets": [
              {
                "id": 0,
                "category": "",
                "difficulty": 0,
                "words": [
                  {
                    "id": 0,
                    "word": ""
                  }
                ]
              }
            ]
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/gamesets/:gameset_id"
      method: GET
      params:
        - name: gameset_id
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
