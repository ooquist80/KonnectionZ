info:
  name: Create Gameset
  type: http
  seq: 1
  tags:
    - gamesets

http:
  method: POST
  url: "{{baseUrl}}/gamesets/"
  body:
    type: json
    data: |-
      {
        "id": "",
        "date": "",
        "name": "",
        "wordsets": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/gamesets/"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": "",
            "date": "",
            "name": "",
            "wordsets": []
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "date": "",
            "name": "",
            "wordsets": []
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/gamesets/"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": "",
            "date": "",
            "name": "",
            "wordsets": []
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
