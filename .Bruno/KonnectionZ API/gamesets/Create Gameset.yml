info:
  name: Create Gameset
  type: http
  seq: 1
  tags:
    - gamesets

http:
  method: POST
  url: "{{baseUrl}}/gamesets/"
  body:
    type: json
    data: |-
      {
        "date": "",
        "name": "",
        "wordsets": []
      }
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: auth/token
    refreshTokenUrl: "{{oauth_refresh_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: header
    scope: user:play user:admin
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/gamesets/"
      method: POST
      body:
        type: json
        data: |-
          {
            "date": "",
            "name": "",
            "wordsets": []
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "date": "",
            "name": "",
            "wordsets": [
              {
                "id": 0,
                "category": "",
                "difficulty": 0,
                "words": [
                  {
                    "id": 0,
                    "word": ""
                  }
                ]
              }
            ]
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/gamesets/"
      method: POST
      body:
        type: json
        data: |-
          {
            "date": "",
            "name": "",
            "wordsets": []
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
